name: Test DynamoDB OIDC Read Access

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-ddb:
    runs-on: ubuntu-latest

    steps:
      - name: Show GitHub OIDC claims
        shell: bash
        run: |
          TOKEN_RESPONSE="$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")"

          ID_TOKEN="$(echo "$TOKEN_RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"

          export ID_TOKEN

          python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["ID_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("sub:", claims.get("sub"))
          print("aud:", claims.get("aud"))
          print("repository:", claims.get("repository"))
          print("ref:", claims.get("ref"))
          PY

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::418295699841:role/GitHubDDBReadonlyAnalyst
          aws-region: us-east-1

      - name: Confirm assumed AWS identity
        run: aws sts get-caller-identity

      - name: Test DynamoDB read access
        run: |
          aws dynamodb describe-table \
            --table-name y62db-config-rule-catalog
