name: Generate containers Conformance Pack

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  generate-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 PyYAML

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::418295699841:role/GitHubDDBReadonlyAnalyst
          aws-region: us-east-1

      - name: Generate containers conformance pack
        run: |
          mkdir -p generated
          python3 python/cpgNG.py \
            -r JSON/containers.json \
            -o generated/containers.yml \
            --table y62db-config-rule-catalog \
            --region us-east-1 \
            --group 26y \
            --binding default 

      - name: Show generated files
        run: ls -lah generated

      - name: Set artifact stamp
        id: stamp
        run: echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Upload generated conformance-pack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: containers${{ steps.stamp.outputs.tag }}-QC4
          path: |
            generated/containers-part*.yml
            generated/containers-part*.csv
          if-no-files-found: error

      - name: Upload generated conformance-pack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: containers${{ steps.stamp.outputs.tag }}-test
          path: |
            generated/containers-part*.yml
            generated/containers-part*.csv
          if-no-files-found: error
