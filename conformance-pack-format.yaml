AWSTemplateFormatVersion: '2010-09-09'
Description: "Y62 Managed Config Rule Manifest\n"
Resources:
  AccessKeysRotatedRule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: access-keys-rotated
      Description: Checks if active IAM access keys are rotated (changed) within the number of days specified in maxAccessKeyAge...
      Scope:
        ComplianceResourceTypes:
          - AWS::IAM::User
      Source:
        Owner: AWS
        SourceIdentifier: ACCESS_KEYS_ROTATED
      InputParameters:
        maxAccessKeyAge: 90
  # …repeat for every rule…